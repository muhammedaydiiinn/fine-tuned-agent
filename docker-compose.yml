x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - agent-backend
      - supervisor-panel
    networks:
      - anruf-net
    healthcheck:
      # Alpine resolves localhost to ::1 first, while this nginx config listens
      # on IPv4. Use the explicit loopback address to avoid false unhealthy state.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # ── Veritabanı ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anruf-net
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # ── Job queue and ephemeral runtime state ─────────────────────────────────
  redis:
    # The application uses core Redis list/key commands only. Plain Redis avoids
    # loading unused Search/JSON/Gears modules and their startup warnings.
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    networks:
      - anruf-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # ── Agent backend (ana API) ─────────────────────────────────────────────────
  agent-backend:
    build:
      context: ./services/agent-backend
    env_file: .env
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - ./data:/data
    networks:
      - anruf-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-manager:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    # Bound to loopback only — reachable from the host for local dev/curl but
    # not exposed to external networks. nginx proxies /api/ in production.
    ports:
      - "127.0.0.1:8010:8010"

  # ── Model manager: atomic production model promotion + vLLM restart ───────
  model-manager:
    build:
      context: ./services/model-manager
    env_file: .env
    environment:
      PRODUCTION_MODEL_PATH: ${PRODUCTION_MODEL_PATH:-/models/production/current}
      DOCKER_SERVICE_NAME: vllm-server
    volumes:
      - ${MODELS_DIR:-./models}:/models
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - anruf-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # ── Supervisor panel ────────────────────────────────────────────────────────
  supervisor-panel:
    build:
      context: ./services/supervisor-panel
    env_file: .env
    environment:
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecretdevsecretdevsecretdevsecret}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-anrufblocker-voice}
    networks:
      - anruf-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Bound to loopback only — same rationale as agent-backend above.
    ports:
      - "127.0.0.1:8020:8020"

  # ── LiveKit WebRTC media server (Milestone 7) ──────────────────────────────
  livekit-server:
    image: livekit/livekit-server:v1.9
    # LIVEKIT_NODE_IP must be set to the server's public IP in .env on GPU host.
    # 127.0.0.1 is fine for local dev but WebRTC ICE will fail in production.
    command: --bind 0.0.0.0 --udp-port 7882 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecretdevsecretdevsecretdevsecret}"
      # LiveKit reports normal WebRTC disconnect teardown as WARN. Product
      # lifecycle events are recorded by voice-runtime; use warn temporarily
      # when diagnosing transport issues.
      LIVEKIT_LOGGING_LEVEL: ${LIVEKIT_LOGGING_LEVEL:-error}
    networks:
      - anruf-net
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped
    logging: *default-logging

  # ── LiveKit STT → agent backend → TTS worker (Milestone 7) ────────────────
  voice-runtime-worker:
    build:
      context: ./services/voice-runtime
    command: python -m app.worker start
    env_file: .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit-server:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecretdevsecretdevsecretdevsecret}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-anrufblocker-voice}
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    networks:
      - anruf-net
    depends_on:
      - livekit-server
      - agent-backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    logging: *default-logging

  # ── Production vLLM model server (default on GPU production hosts) ─────────
  vllm-server:
    image: vllm/vllm-openai:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      # Allow loading/unloading candidate LoRA adapters at runtime so candidate
      # evaluation runs on this same server (no second 24B model, no downtime).
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "True"
    volumes:
      # PRODUCTION_MODEL_PATH is a *container*-internal path (used by model-manager
      # under its /models mount); the vLLM bind-mount needs the *host* path.
      - ${MODELS_DIR:-./models}/production/current:/model:ro
      # Candidate LoRA adapters, loaded on demand for evaluation.
      - ${MODELS_DIR:-./models}/adapters:/adapters:ro
    command: >
      --model /model
      --served-model-name ${PRODUCTION_SERVED_MODEL_NAME:-anrufblocker-production}
      --max-model-len 4096
      --gpu-memory-utilization 0.85
      --enable-prefix-caching
      --enable-lora
      --max-lora-rank 32
      --max-loras 2
      --port 8000
    networks:
      - anruf-net
    restart: unless-stopped
    logging: *default-logging

  # ── Isolated candidate model server (M5/M6 pre-deploy evaluation) ──────────
  # IMPORTANT: Never run alongside vllm-server or training-worker on a single
  # GPU host. Qwen3.5 9B needs ~18 GB; two instances would exceed A6000 48 GB.
  # Candidate eval workflow:
  #   1. docker compose stop vllm-server
  #   2. docker compose --profile candidate-eval up -d vllm-candidate
  #   3. run eval, then reverse the steps.
  vllm-candidate:
    image: vllm/vllm-openai:latest
    profiles:
      - candidate-eval
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ${CANDIDATE_MODEL_PATH:-./models/candidates/current}:/model:ro
    command: >
      --model /model
      --served-model-name ${CANDIDATE_MODEL_NAME:-anrufblocker-candidate}
      --max-model-len 4096
      --gpu-memory-utilization 0.60
      --port 8000
    networks:
      - anruf-net
    restart: unless-stopped
    logging: *default-logging

  # ── Training worker — local/mock profile (no GPU reservation) ───────────────
  training-worker:
    build:
      context: ./services/training-worker
    profiles:
      - workers
    env_file: .env
    volumes:
      - ${MODELS_DIR:-./models}:/models
      - ./data:/data
    networks:
      - anruf-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ── Training worker — real GPU production default ──────────────────────────
  training-worker-gpu:
    build:
      context: ./services/training-worker
      dockerfile: Dockerfile.gpu
    env_file: .env
    volumes:
      - ${MODELS_DIR:-./models}:/models
      - ./data:/data
    networks:
      - anruf-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    logging: *default-logging

  # ── Eval worker (Milestone 5'te aktif edilecek) ─────────────────────────────
  eval-worker:
    build:
      context: ./services/eval-worker
    env_file: .env
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - ./data:/data
    networks:
      - anruf-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-backend:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:

networks:
  anruf-net:
    driver: bridge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # Uncomment when SSL certificates are mounted (see infra/nginx/nginx.conf):
      # - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment to mount SSL certs for HTTPS:
      # - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - agent-backend
      - supervisor-panel
    networks:
      - agent-net
    healthcheck:
      # Alpine resolves localhost to ::1 first, while this nginx config listens
      # on IPv4. Use the explicit loopback address to avoid false unhealthy state.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # ── Veritabanı ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agent-net
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # ── Job queue and ephemeral runtime state ─────────────────────────────────
  redis:
    # The application uses core Redis list/key commands only. Plain Redis avoids
    # loading unused Search/JSON/Gears modules and their startup warnings.
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    networks:
      - agent-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # ── Agent backend (ana API) ─────────────────────────────────────────────────
  agent-backend:
    build:
      context: ./services/agent-backend
    env_file: .env
    volumes:
      - ./models:/models:ro
      - ./data:/data
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Lokal geliştirmede port açık; prod'da sadece nginx üzerinden erişilir
    ports:
      - "8010:8010"

  # ── Supervisor panel ────────────────────────────────────────────────────────
  supervisor-panel:
    build:
      context: ./services/supervisor-panel
    env_file: .env
    environment:
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecretdevsecretdevsecretdevsecret}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-fine-tuned-agent-voice}
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8020:8020"

  # ── LiveKit WebRTC media server (Milestone 7) ──────────────────────────────
  livekit-server:
    image: livekit/livekit-server:v1.9
    command: --bind 0.0.0.0 --udp-port 7882 --node-ip 127.0.0.1
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecretdevsecretdevsecretdevsecret}"
      LIVEKIT_LOGGING_LEVEL: ${LIVEKIT_LOGGING_LEVEL:-warn}
    networks:
      - agent-net
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped
    logging: *default-logging

  # ── LiveKit STT → agent backend → TTS worker (Milestone 7) ────────────────
  voice-runtime-worker:
    build:
      context: ./services/voice-runtime
    command: python -m app.worker start
    env_file: .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit-server:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecretdevsecretdevsecretdevsecret}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-fine-tuned-agent-voice}
    volumes:
      - ./models:/models:ro
    networks:
      - agent-net
    depends_on:
      - livekit-server
      - agent-backend
    restart: unless-stopped
    logging: *default-logging

  # ── vLLM model server (sadece VLLM_MODE=real + GPU sunucuda) ───────────────
  vllm-server:
    image: vllm/vllm-openai:latest
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ${MODEL_MERGED_PATH:-./models/merged/fine-tuned-agent-v14}:/model:ro
    command: >
      --model /model
      --served-model-name ${VLLM_MODEL_NAME:-fine-tuned-agent-v14}
      --max-model-len 4096
      --gpu-memory-utilization 0.45
      --port 8000
    networks:
      - agent-net
    restart: unless-stopped
    logging: *default-logging

  # ── Isolated candidate model server (M5/M6 pre-deploy evaluation) ──────────
  vllm-candidate:
    image: vllm/vllm-openai:latest
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ${CANDIDATE_MODEL_PATH:-./models/candidates/current}:/model:ro
    command: >
      --model /model
      --served-model-name ${CANDIDATE_MODEL_NAME:-fine-tuned-agent-candidate}
      --max-model-len 4096
      --gpu-memory-utilization 0.45
      --port 8000
    networks:
      - agent-net
    restart: unless-stopped
    logging: *default-logging

  # ── Training worker (Milestone 4'te aktif edilecek) ─────────────────────────
  training-worker:
    build:
      context: ./services/training-worker
    profiles:
      - workers
    env_file: .env
    volumes:
      - ./models:/models
      - ./data:/data
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ── Eval worker (Milestone 5'te aktif edilecek) ─────────────────────────────
  eval-worker:
    build:
      context: ./services/eval-worker
    profiles:
      - workers
    env_file: .env
    volumes:
      - ./models:/models:ro
      - ./data:/data
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-backend:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:

networks:
  agent-net:
    driver: bridge

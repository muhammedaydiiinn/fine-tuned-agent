<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Panel{% endblock %} — CallShield</title>
  <meta name="csrf-token" content="{{ request.state.csrf_token | default('') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css?v=15">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/panel-ui.js?v=4" defer></script>
  <!-- Send CSRF token on every HTMX mutating request -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const token = document.querySelector('meta[name="csrf-token"]')?.content || "";
      document.body.setAttribute("hx-headers", JSON.stringify({"X-CSRF-Token": token}));
    });
    function applyLocalTimes(root) {
      (root || document).querySelectorAll("time[data-utc]").forEach(el => {
        const iso = el.getAttribute("data-utc");
        if (!iso) return;
        const d = new Date(iso.endsWith("Z") || iso.includes("+") ? iso : iso + "Z");
        if (isNaN(d)) return;
        const fmt = el.getAttribute("data-fmt") || "datetime";
        if (fmt === "time") {
          el.textContent = d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
        } else if (fmt === "short") {
          el.textContent = d.toLocaleString([], {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
        } else {
          el.textContent = d.toLocaleString([], {year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
        }
        el.title = d.toLocaleString();
      });
    }
    document.addEventListener("DOMContentLoaded", () => applyLocalTimes());
    document.addEventListener("htmx:afterSwap", e => applyLocalTimes(e.target));
  </script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js" defer></script>
  <script src="/static/datatable.js?v=9" defer></script>
</head>
<body>
<script id="panel-flash-toast" type="application/json">
  {{ request.state.flash_toast | tojson if request.state.flash_toast else 'null' }}
</script>
<div class="toast-stack" data-toast-root aria-live="polite" aria-atomic="false"></div>
<div class="confirm-modal" data-confirm-modal hidden>
  <button class="confirm-modal-backdrop" type="button" data-confirm-cancel
          aria-label="Close confirmation"></button>
  <section class="confirm-modal-card" role="dialog" aria-modal="true"
           aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-message">
    <div class="confirm-modal-icon" data-confirm-icon aria-hidden="true">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <div class="confirm-modal-content">
      <h2 id="confirm-modal-title" data-confirm-title>Confirm action</h2>
      <p id="confirm-modal-message" data-confirm-message></p>
      <div class="confirm-modal-actions">
        <button class="btn btn-outline" type="button" data-confirm-cancel>Cancel</button>
        <button class="btn btn-danger" type="button" data-confirm-submit>Confirm</button>
      </div>
    </div>
  </section>
</div>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">AB</div>
      <div>
        <div class="brand-name">CallShield</div>
        <div class="brand-sub">Supervisor Panel</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Workspace</div>

      <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
        <i class="fa-solid fa-phone nav-icon"></i>
        Sessions
      </a>

      <a href="/review" class="nav-item {% if request.url.path.startswith('/review') %}active{% endif %}">
        <i class="fa-solid fa-clipboard-check nav-icon"></i>
        Review
      </a>

      <a href="/pipeline" class="nav-item {% if request.url.path.startswith('/pipeline') or request.url.path.startswith('/training') or request.url.path.startswith('/model-registry') %}active{% endif %}">
        <i class="fa-solid fa-microchip nav-icon"></i>
        Pipeline
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="/logout" class="nav-item nav-logout">
        <i class="fa-solid fa-right-from-bracket nav-icon"></i>
        Sign Out
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">
      {% block content %}{% endblock %}
    </div>
  </main>

</div>
{% block scripts %}{% endblock %}
</body>
</html>

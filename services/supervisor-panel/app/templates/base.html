<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Panel{% endblock %} — Anrufblocker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
  <link rel="stylesheet" href="/static/style.css?v=4">
  <script src="/static/htmx.min.js" defer></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js" defer></script>
  <script src="/static/datatable.js?v=5" defer></script>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">AB</div>
      <div>
        <div class="brand-name">Anrufblocker</div>
        <div class="brand-sub">Supervisor Panel</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu</div>

      <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
        <i class="fa-solid fa-phone nav-icon"></i>
        Sessions
      </a>

      <a href="/corrections" class="nav-item {% if request.url.path == '/corrections' %}active{% endif %}">
        <i class="fa-solid fa-pen-to-square nav-icon"></i>
        Corrections
      </a>

      <a href="/training-candidates" class="nav-item {% if request.url.path.startswith('/training-candidates') %}active{% endif %}">
        <i class="fa-solid fa-layer-group nav-icon"></i>
        Training Data
      </a>

      <a href="/training-jobs" class="nav-item {% if request.url.path.startswith('/training-jobs') %}active{% endif %}">
        <i class="fa-solid fa-microchip nav-icon"></i>
        Training Jobs
      </a>

      <a href="/eval-jobs" class="nav-item {% if request.url.path.startswith('/eval-jobs') %}active{% endif %}">
        <i class="fa-solid fa-flask-vial nav-icon"></i>
        Evaluations
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="/logout" class="nav-item nav-logout">
        <i class="fa-solid fa-right-from-bracket nav-icon"></i>
        Sign Out
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">
      {% block content %}{% endblock %}
    </div>
  </main>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Panel{% endblock %} — Anrufblocker</title>
  <meta name="csrf-token" content="{{ request.state.csrf_token | default('') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
  <link rel="stylesheet" href="/static/style.css?v=9">
  <script src="/static/htmx.min.js" defer></script>
  <!-- Send CSRF token on every HTMX mutating request -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const token = document.querySelector('meta[name="csrf-token"]')?.content || "";
      document.body.setAttribute("hx-headers", JSON.stringify({"X-CSRF-Token": token}));
    });
  </script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js" defer></script>
  <script src="/static/datatable.js?v=7" defer></script>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">AB</div>
      <div>
        <div class="brand-name">Anrufblocker</div>
        <div class="brand-sub">Supervisor Panel</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Workspace</div>

      <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
        <i class="fa-solid fa-phone nav-icon"></i>
        Sessions
      </a>

      <a href="/review" class="nav-item {% if request.url.path.startswith('/review') %}active{% endif %}">
        <i class="fa-solid fa-clipboard-check nav-icon"></i>
        Review & Train
      </a>

      <a href="/model-registry" class="nav-item {% if request.url.path.startswith('/model-registry') %}active{% endif %}">
        <i class="fa-solid fa-code-branch nav-icon"></i>
        Models
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="/logout" class="nav-item nav-logout">
        <i class="fa-solid fa-right-from-bracket nav-icon"></i>
        Sign Out
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">
      {% block content %}{% endblock %}
    </div>
  </main>

</div>
{% block scripts %}{% endblock %}
</body>
</html>

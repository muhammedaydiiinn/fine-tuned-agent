{% if recordings %}
<div class="recording-list">
  {% for r in recordings %}
  <div class="recording-row">
    <div class="ab-player"
         data-audio-src="/recordings/{{ r.id }}/audio"
         {% if r.duration_seconds %}data-duration="{{ r.duration_seconds }}"{% endif %}></div>
    <time class="voice-note-time" datetime="{{ r.created_at.isoformat() }}" data-panel-datetime></time>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="helper-text">Bu görüşme için çağrı kaydı yok.</div>
{% endif %}

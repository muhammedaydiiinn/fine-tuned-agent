{% extends "base.html" %}
{% block title %}Sessions{% endblock %}

{% block content %}

<div class="page-header">
  <div class="page-header-left">
    <h1>Sessions</h1>
  </div>
  <div class="page-header-right">
    <form action="/sessions/start" method="post" class="session-start-form">
      <input name="external_session_id" placeholder="Optional session name">
      <button class="btn btn-primary" type="submit">
        <i class="fa-solid fa-plus"></i> Start Session
      </button>
    </form>
  </div>
</div>

<div class="stats-row">
  <div class="stat-card blue">
    <div class="stat-label">Total</div>
    <div class="stat-value">{{ total_count }}</div>
  </div>
  <div class="stat-card green">
    <div class="stat-label">Active</div>
    <div class="stat-value">{{ active_count }}</div>
  </div>
  <div class="stat-card purple">
    <div class="stat-label">Total Turns</div>
    <div class="stat-value">{{ total_turns }}</div>
  </div>
  <div class="stat-card yellow">
    <div class="stat-label">Closed</div>
    <div class="stat-value">{{ closed_count }}</div>
  </div>
</div>

<div class="table-container">
  <div class="table-toolbar">
    <span class="table-toolbar-title">Live and Recent Sessions</span>
  </div>
  <table data-dt-url="/sessions/data" data-dt-order="0,desc">
    <thead>
      <tr>
        <th data-dt-col-field="external_session_id" data-dt-col-render="sessionId">Session</th>
        <th data-dt-col-field="status" data-dt-col-render="badge">Status</th>
        <th data-dt-col-field="stage" data-dt-col-render="badge">Stage</th>
        <th data-dt-col-field="turns" data-dt-col-class="td-center">Turns</th>
        <th data-dt-col-field="hard_decline" data-dt-col-render="hardDecline" data-dt-col-class="td-center">Hard Decline</th>
        <th data-dt-col-field="created_at" data-dt-col-render="datetime">Created</th>
        <th data-dt-col-field="id" data-dt-col-render="sessionLink" data-dt-col-orderable="false" data-dt-col-width="90px"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

{% endblock %}

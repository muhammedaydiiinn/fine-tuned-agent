{% extends "base.html" %}
{% block title %}Sessions{% endblock %}

{% block content %}

<div class="page-header">
  <div class="page-header-left">
    <h1>Sessions</h1>
  </div>
</div>

<div class="stats-row">
  <div class="stat-card blue">
    <div class="stat-label">Total</div>
    <div class="stat-value">{{ total_count }}</div>
  </div>
  <div class="stat-card green">
    <div class="stat-label">Active</div>
    <div class="stat-value">{{ active_count }}</div>
  </div>
  <div class="stat-card purple">
    <div class="stat-label">Total Turns</div>
    <div class="stat-value">{{ total_turns }}</div>
  </div>
  <div class="stat-card yellow">
    <div class="stat-label">Closed</div>
    <div class="stat-value">{{ closed_count }}</div>
  </div>
</div>

<div class="table-container">
  <div class="table-toolbar">
    <span class="table-toolbar-title">All Sessions</span>
  </div>
  <table data-dt-url="/sessions/data" data-dt-order="0,desc">
    <thead>
      <tr>
        <th data-field="external_session_id" data-render="sessionId">Session</th>
        <th data-field="status"  data-render="badge">Status</th>
        <th data-field="stage"   data-render="badge">Stage</th>
        <th data-field="turns"   data-class="td-center">Turns</th>
        <th data-field="hard_decline" data-render="hardDecline" data-class="td-center">Hard Decline</th>
        <th data-field="created_at" data-render="datetime">Created</th>
        <th data-field="id" data-render="sessionLink" data-orderable="false" data-width="90px"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

{% endblock %}

{% extends "base.html" %}
{% block title %}Corrections{% endblock %}

{% block content %}

<div class="page-header">
  <div class="page-header-left">
    <h1>Corrections</h1>
  </div>
</div>

<div class="stats-row">
  <div class="stat-card blue">
    <div class="stat-label">Total</div>
    <div class="stat-value">{{ total_count }}</div>
  </div>
  <div class="stat-card green">
    <div class="stat-label">Memory Applied</div>
    <div class="stat-value">{{ memory_count }}</div>
  </div>
  <div class="stat-card purple">
    <div class="stat-label">Training Candidates</div>
    <div class="stat-value">{{ training_count }}</div>
  </div>
</div>

<div class="table-container">
  <div class="table-toolbar">
    <span class="table-toolbar-title">All Corrections</span>
  </div>
  <table data-dt-url="/corrections/data" data-dt-order="0,desc">
    <thead>
      <tr>
        <th data-dt-col-field="correction_type" data-dt-col-render="badge">Type</th>
        <th data-dt-col-field="old_response" data-dt-col-render="truncate">Old Response</th>
        <th data-dt-col-field="new_response" data-dt-col-render="truncate">New Response</th>
        <th data-dt-col-field="next_action" data-dt-col-render="badge">Next Action</th>
        <th data-dt-col-field="apply_immediately" data-dt-col-render="boolCheck" data-dt-col-class="td-center">Memory</th>
        <th data-dt-col-field="send_to_training" data-dt-col-render="boolCheck" data-dt-col-class="td-center">Training</th>
        <th data-dt-col-field="created_at" data-dt-col-render="datetime">Date</th>
        <th data-dt-col-field="id" data-dt-col-render="correctionLink" data-dt-col-orderable="false" data-dt-col-width="80px"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

{% endblock %}

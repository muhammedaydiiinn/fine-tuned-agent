{% extends "base.html" %}
{% block title %}Corrections{% endblock %}

{% block content %}

<div class="page-header">
  <div class="page-header-left">
    <h1>Corrections</h1>
  </div>
</div>

<div class="stats-row">
  <div class="stat-card blue">
    <div class="stat-label">Total</div>
    <div class="stat-value">{{ total_count }}</div>
  </div>
  <div class="stat-card green">
    <div class="stat-label">Memory Applied</div>
    <div class="stat-value">{{ memory_count }}</div>
  </div>
  <div class="stat-card purple">
    <div class="stat-label">Training Candidates</div>
    <div class="stat-value">{{ training_count }}</div>
  </div>
</div>

<div class="table-container">
  <div class="table-toolbar">
    <span class="table-toolbar-title">All Corrections</span>
  </div>
  <table data-dt-url="/corrections/data" data-dt-order="0,desc">
    <thead>
      <tr>
        <th data-field="correction_type" data-render="badge">Type</th>
        <th data-field="old_response"   data-render="truncate">Old Response</th>
        <th data-field="new_response"   data-render="truncate">New Response</th>
        <th data-field="next_action"    data-render="badge">Next Action</th>
        <th data-field="apply_immediately" data-render="boolCheck" data-class="td-center">Memory</th>
        <th data-field="send_to_training"  data-render="boolCheck" data-class="td-center">Training</th>
        <th data-field="created_at"     data-render="datetime">Date</th>
        <th data-field="id" data-render="correctionLink" data-orderable="false" data-width="80px"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

{% endblock %}

{% if notes %}
<div class="recording-list">
  {% for n in notes %}
  <div class="recording-row">
    <div class="ab-player"
         data-audio-src="/recordings/{{ n.id }}/audio"
         {% if n.duration_seconds %}data-duration="{{ n.duration_seconds }}"{% endif %}></div>
    <time class="voice-note-time" datetime="{{ n.created_at.isoformat() }}" data-panel-datetime></time>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="helper-text">Henüz sesli not yok.</div>
{% endif %}

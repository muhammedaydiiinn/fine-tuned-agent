events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    map "$uri:$status" $loggable {
        default 1;
        ~^/health:[23] 0;
        ~^/sessions/[0-9]+/(conversation|live-summary|voice-events):[23] 0;
    }

    access_log /var/log/nginx/access.log main if=$loggable;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Docker replaces container IPs on recreate. Resolve service names through
    # Docker DNS continuously so nginx does not retain stale upstream IPs.
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 2s;

    upstream agent_backend {
        zone agent_backend 64k;
        server agent-backend:8010 resolve;
    }

    upstream supervisor_panel {
        zone supervisor_panel 64k;
        server supervisor-panel:8020 resolve;
    }

    # ── Güvenlik header'ları — her yanıta eklenir ───────────────────────────
    add_header X-Frame-Options          "DENY"                              always;
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy       "microphone=(self)"                  always;

    # ── HTTP → HTTPS yönlendirme ─────────────────────────────────────────────
    # SSL sertifikası monte edilene kadar bu sunucu bloğu aktif HTTP sunucusu
    # olarak çalışır. Prod'da yorum satırını kaldır ve 443 bloğunu aktif et.
    server {
        listen 80;
        server_name _;

        # Uncomment to redirect HTTP → HTTPS in production:
        # return 301 https://$host$request_uri;

        # Proxy health is independent from upstream readiness. Backend and panel
        # containers have their own healthchecks, so nginx startup/reload should
        # not emit connection-refused errors while they are being recreated.
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        # Agent API
        location /api/ {
            proxy_pass         http://agent_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Supervisor panel (kök)
        location / {
            proxy_pass         http://supervisor_panel/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTPS sunucu bloğu ───────────────────────────────────────────────────
    # Gereksinimler:
    #   1. ./infra/nginx/ssl/fullchain.pem  (domain sertifikası + ara CA)
    #   2. ./infra/nginx/ssl/privkey.pem    (özel anahtar)
    # Self-signed test sertifikası üretmek için:
    #   mkdir -p infra/nginx/ssl
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout infra/nginx/ssl/privkey.pem \
    #     -out infra/nginx/ssl/fullchain.pem \
    #     -subj "/CN=localhost"
    # docker-compose.yml'de 443 portunu ve ssl volume'ü etkinleştirmeyi unutma.
    #
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     # HSTS — yalnızca gerçek bir sertifika ile etkinleştir
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #
    #     location /api/ {
    #         proxy_pass         http://agent_backend/;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 120s;
    #     }
    #
    #     location / {
    #         proxy_pass         http://supervisor_panel/;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #     }
    # }
}

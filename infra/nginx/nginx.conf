events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';

    map "$uri:$status" $loggable {
        default                                                              1;
        ~^/health:[23]                                                       0;
        ~^/sessions/data:[23]                                                0;
        ~^/sessions/[0-9]+/(conversation|live-summary|voice-events):[23]     0;
        ~^/static/.*:304                                                     0;
        ~^/static/.*:200                                                     0;
        ~^/favicon\.ico:[23]                                                 0;
    }

    access_log /var/log/nginx/access.log main if=$loggable;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 2s;

    # Rate limiting zones
    # login: only the POST submit is rate-limited. GET page views map to an
    # empty key, which nginx does NOT count — so opening/refreshing the login
    # page can never lock the user out. Brute-force POST floods are still capped.
    map $request_method $login_rl_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $login_rl_key zone=login:10m rate=20r/m;
    # api: 60 req/minute per IP for the agent-backend endpoints
    limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/m;
    limit_req_status 429;

    upstream agent_backend {
        zone agent_backend 64k;
        server agent-backend:8010 resolve;
    }

    upstream supervisor_panel {
        zone supervisor_panel 64k;
        server supervisor-panel:8020 resolve;
    }

    add_header X-Frame-Options          "DENY"                              always;
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy       "microphone=(self)"                  always;
    # X-XSS-Protection for legacy browsers (modern browsers ignore it in favour
    # of CSP, but it costs nothing to include).
    add_header X-XSS-Protection         "1; mode=block"                     always;

    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS — tell browsers to always use HTTPS for this host.
        # max-age=63072000 is two years. Add includeSubDomains only if all
        # subdomains also serve HTTPS.
        add_header Strict-Transport-Security "max-age=63072000"           always;
        add_header X-XSS-Protection         "1; mode=block"               always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://agent_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # LiveKit signal WebSocket (wss:// → ws://livekit-server:7880)
        location /rtc {
            proxy_pass         http://livekit-server:7880;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
        }

        # Login endpoint — rate limit applies to POST submits only (see map above).
        location = /login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass         http://supervisor_panel/login;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         http://supervisor_panel/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}

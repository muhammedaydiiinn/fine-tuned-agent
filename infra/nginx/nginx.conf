events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';

    map "$uri:$status" $loggable {
        default                                                              1;
        ~^/health:[23]                                                       0;
        ~^/sessions/data:[23]                                                0;
        ~^/sessions/[0-9]+/(conversation|live-summary|voice-events):[23]     0;
        ~^/static/.*:304                                                     0;
        ~^/static/.*:200                                                     0;
        ~^/favicon\.ico:[23]                                                 0;
    }

    access_log /var/log/nginx/access.log main if=$loggable;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 2s;

    upstream agent_backend {
        zone agent_backend 64k;
        server agent-backend:8010 resolve;
    }

    upstream supervisor_panel {
        zone supervisor_panel 64k;
        server supervisor-panel:8020 resolve;
    }

    add_header X-Frame-Options          "DENY"                              always;
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy       "microphone=(self)"                  always;

    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        location /api/ {
            proxy_pass         http://agent_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass         http://supervisor_panel/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
